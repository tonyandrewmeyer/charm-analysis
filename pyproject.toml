[project]
name = "charm-analysis"
version = "1.0.0b1"
description = "Tool to analyse charm code en masse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    # 0.28.1 pulls in httpcore 1.0.9, which is the first version that can be
    # imported on Python 3.14.
    "httpx>=0.28.1",
    "packaging>=24.1",
    "pyyaml>=6.0.2",
    "rich>=13.8.0",
]
